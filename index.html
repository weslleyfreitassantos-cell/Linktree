<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#6e7965" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <style>
    .decor,.fruit-bowl{display:none!important}
    body.is-loading .page-shell{visibility:hidden}
    .page-shell{background-color:#071a3b;background-image:linear-gradient(rgba(8,24,60,.16),rgba(8,24,60,.16)),url('assets/background-educacao.png?v=2');background-position:center top;background-size:cover;background-repeat:no-repeat}
  </style>
  <title>Seu nome | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//www.instagram.com">
  <link rel="dns-prefetch" href="//www.tiktok.com">
  <link rel="dns-prefetch" href="//api.whatsapp.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16&rev=mobile-bg-fit" />
</head>
<body class="is-loading">
  <main class="page-shell">
    <section class="profile" aria-label="Perfil e links">
      <div class="avatar" id="avatar" aria-label="Logo">Sua<br>marca</div>
      <h1 id="profileName">Seu nome</h1>
      <p id="profileBio">Uma frase curta sobre você</p>

      <nav class="links" id="links" aria-label="Links principais"></nav>

      <div class="socials" id="socials" aria-label="Redes sociais"></div>
    </section>

  </main>

  <script src="config.js?v=2"></script>
  <script src="script.js?v=21&rev=per-profile-visual-identity-mobile-bg"></script>
  <script>
    document.querySelectorAll('#links a[href*="whatsapp"],#links a[href*="wa.me"]').forEach(function(a){
      var label=a.querySelector('span:last-child')?.textContent||'WhatsApp';
      a.innerHTML='<span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.4a9.2 9.2 0 0 1 9.2 9.2 9.2 9.2 0 0 1-9.2 9.2 9 9 0 0 1-4.8-1.4L2.7 21l1.4-4.4A9.2 9.2 0 1 1 12 2.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path transform="translate(1.3 1.3) scale(.82)" d="M8 8c.4-.4.8-.3 1.1.1l1.1 1.6c.2.3.2.6-.1.9l-.6.6c.7 1.2 1.7 2.2 3 2.9l.6-.6c.3-.3.6-.3.9-.1l1.6 1.2c.4.3.4.7 0 1-.8.8-1.9.9-3.1.4-2.7-1.1-4.7-3.1-5.9-5.8-.5-1.2-.4-2.2.3-3z" fill="currentColor"/></svg></span><span>'+label+'</span>';
    });
  </script>
  <script>
    document.querySelectorAll('#links a[href*="whatsapp"],#links a[href*="wa.me"]').forEach(function(a){
      var label=a.querySelector('span:last-child')?.textContent||'WhatsApp';
      a.innerHTML='<span class="link-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="11.5" r="8.7" fill="none" stroke="currentColor" stroke-width="1.8"/><path transform="translate(1.55 1.05) scale(.9)" d="M8 8c.4-.4.8-.3 1.1.1l1.1 1.6c.2.3.2.6-.1.9l-.6.6c.7 1.2 1.7 2.2 3 2.9l.6-.6c.3-.3.6-.3.9-.1l1.6 1.2c.4.3.4.7 0 1-.8.8-1.9.9-3.1.4-2.7-1.1-4.7-3.1-5.9-5.8-.5-1.2-.4-2.2.3-3z" fill="currentColor"/></svg></span><span>'+label+'</span>';
    });
  </script>
  <script>
    document.querySelectorAll('#links a[href*="tiktok"]').forEach(function(a){
      var label=a.querySelector('span:last-child')?.textContent||'Tik Tok';
      a.querySelector('.link-icon').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M14.2 3h3c.2 1.7 1.1 3 2.8 3.8v3.1c-1.1-.1-2.1-.5-3-1.1v6.1a5.2 5.2 0 1 1-4.5-5.1v3.1a2.1 2.1 0 1 0 1.7 2V3z"/></svg>';
    });
  </script>
  <script>
    document.querySelectorAll('#links a').forEach(function(a){
      var icon=a.querySelector('.link-icon'), label=a.querySelector('span:last-child')?.textContent||'Abrir link';
      if(!icon) return;
      var lower=label.toLowerCase(),color=(a.href.includes('whatsapp')||a.href.includes('wa.me')||lower.includes('whatsapp'))?'#25D366':(lower.includes('instagram')?'#E1306C':(lower.includes('site')||a.href.includes('http')&&!lower.includes('tik')?'#2563EB':'#000000'));
      if(lower.includes('tik')){var p=icon.querySelector('path');if(p){p.setAttribute('fill','currentColor');p.removeAttribute('stroke');}}
      icon.style.setProperty('color',color,'important');
      if(icon.querySelector('svg')) icon.querySelector('svg').style.setProperty('color',color,'important');
      var iconMarkup=icon.innerHTML;
      if(lower.includes('instagram')) iconMarkup='<img src="assets/instagram.svg?v=1" alt="">';
      else if(lower.includes('whatsapp')) iconMarkup='<img src="assets/whatsapp.svg?v=1" alt="">';
      else if(lower.includes('tik')) iconMarkup='<span class="tiktok-mark" aria-label="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></span>';
      else if(lower.includes('site')) iconMarkup='<span class="site-mark">WWW</span>';
      a.innerHTML='<span class="link-access">Acessar</span><span class="link-platform"><span class="link-label">'+label+'</span><span class="link-icon" aria-hidden="true" style="color:'+color+'">'+iconMarkup+'</span></span>';
    });
  </script>
</body>
</html>
